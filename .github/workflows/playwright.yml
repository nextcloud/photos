name: Playwright Tests

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  playwright-setup:
    timeout-minutes: 15
    name: Playwright setup
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Get version matrix
      id: php-versions
      uses: icewind1991/nextcloud-version-matrix@8a7bac6300b2f0f3100088b297995a229558ddba # v1.3.2

    - name: Set up PHP
      uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
      with:
        php-version: ${{ steps.php-versions.outputs.php-min }}
        extensions: bz2, ctype, curl, dom, fileinfo, gd, iconv, intl, json, libxml, mbstring, openssl, pcntl, posix, session, simplexml, xmlreader, xmlwriter, zip, zlib, oci8
        coverage: none
        ini-file: development
        tools: composer
        ini-values: disable_functions=

    - name: Install PHP dependencies
      run: |
        composer install --no-dev --no-scripts

    - name: Read package.json
      uses: nextcloud-libraries/parse-package-engines-action@122ae05d4257008180a514e1ddeb0c1b9d094bdd # v0.1.0
      id: versions

    - name: Set up node
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ steps.versions.outputs.node-version }}

    - name: Set up npm
      run: npm i -g 'npm@${{ steps.versions.outputs.package-manager-version }}'

    - name: Install dependencies and build
      run: |
        npm ci
        npm run build --if-present

    - name: Save context
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        key: playwright-context-${{ github.run_id }}
        path: ./

  playwright-tests:
    needs: [playwright-setup]
    timeout-minutes: 60
    name: Playwright tests ${{ matrix.shardIndex == 'recognize' && 'with "recognize" app' || format('{0} / {1}', matrix.shardIndex, matrix.shardTotal) }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2, 3, "recognize"]
        shardTotal: [3]
    outputs:
      node-version: ${{ steps.versions.outputs.node-version }}
      package-manager-version: ${{ steps.versions.outputs.package-manager-version }}

    steps:
    - name: Restore context
      id: cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        key: playwright-context-${{ github.run_id }}
        path: ./

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      if: steps.cache.outputs.cache-hit != 'true'
      with:
        persist-credentials: false

    - name: Read package.json
      uses: nextcloud-libraries/parse-package-engines-action@122ae05d4257008180a514e1ddeb0c1b9d094bdd # v0.1.0
      id: versions

    - name: Set up node
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ steps.versions.outputs.node-version }}

    - name: Set up npm
      if: steps.cache.outputs.cache-hit != 'true'
      run: npm i -g 'npm@${{ steps.versions.outputs.package-manager-version }}'

    - name: Install dependencies and build
      if: steps.cache.outputs.cache-hit != 'true'
      run: |
        npm ci
        npm run build --if-present

    # We use the default chrome shipped with the actions runner
    # - name: Install Playwright browsers
    #   run: npm run playwright:install

    - name: Run Playwright tests
      if: matrix.shardIndex != 'recognize'
      run: npm run playwright -- --shard='${{ matrix.shardIndex }}/${{ matrix.shardTotal }}'

    - name: Run Playwright tests for recognize integration
      if: matrix.shardIndex == 'recognize'
      run: npm run playwright:faces

    - name: Show logs
      if: failure()
      run: |
        # @nextcloud/e2e-test-server names the container after the app directory,
        # so it is discovered rather than hardcoded.
        container=$(docker ps -a --format '{{.Names}}' | grep -i nextcloud | head -n1)
        echo "=== Logs of container ${container} ==="
        docker logs "$container" || true
        echo '=== Nextcloud server logs ==='
        docker exec "$container" cat data/nextcloud.log || true

    - name: Upload blob report to GitHub Actions Artifacts
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: blob-report-${{ matrix.shardIndex }}
        path: blob-report
        retention-days: 1

  merge-reports:
    # Merge reports after playwright-tests, even if some shards have failed
    if: ${{ !cancelled() }}
    needs: [playwright-tests]

    runs-on: ubuntu-latest-low
    steps:
    - name: Restore context
      id: cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        key: playwright-context-${{ github.run_id }}
        path: ./

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      if: steps.cache.outputs.cache-hit != 'true'
      with:
        persist-credentials: false

    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      if: steps.cache.outputs.cache-hit != 'true'
      with:
        node-version: ${{ needs.playwright-tests.outputs.node-version }}

    - name: Set up npm
      if: steps.cache.outputs.cache-hit != 'true'
      run: npm i -g 'npm@${{ needs.playwright-tests.outputs.package-manager-version }}'

    - name: Install dependencies
      if: steps.cache.outputs.cache-hit != 'true'
      run: npm ci

    - name: Download blob reports from GitHub Actions Artifacts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        path: all-blob-reports
        pattern: blob-report-*
        merge-multiple: true

    - name: Merge into HTML Report
      run: npx playwright merge-reports --config tests/playwright/merge.config.ts --reporter html,github ./all-blob-reports

    - name: Upload HTML report
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: html-report--attempt-${{ github.run_attempt }}
        path: playwright-report
        retention-days: 5

    - name: Show the logs
      run: |
        echo 'To view the report:'
        echo '  1. Extract the folder from the zip file'
        echo '  2. run "npx playwright show-report name-of-my-extracted-playwright-report"'

  summary:
    permissions:
      contents: none
    runs-on: ubuntu-latest-low
    needs: [playwright-tests]

    if: always()

    name: playwright-test-summary

    steps:
      - name: Summary status
        run: if ${{ needs.playwright-tests.result != 'success' }}; then exit 1; fi
